[package]
name = "bt-7274"
version = "0.1.0"
description = "A minimal terminal AI chat TUI (ratatui + async-openai)"
authors = ["un4gt <mt3085570450@outlook.com>"]
license = "MIT"
edition = "2024"
repository = "https://github.com/un4gt/BT-7274"
readme = "README.md"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.32"
ratatui = "0.30.2"
tokio = { version = "1.52.3", features = ["full"] }
color-eyre = "0.6.5"
async-openai = { version = "0.41.3", features = ["chat-completion", "responses", "model", "byot"] }
reqwest = { version = "0.13.4", features = ["socks", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.2"
url = "2.5"
uuid = { version = "1.24", features = ["v4"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.1.4", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
base64 = "0.22.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
tui-markdown = "0.3.9"
unicode-segmentation = "1.12"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
